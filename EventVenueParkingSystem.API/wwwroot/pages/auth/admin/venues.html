<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Venue Management</title>

    <link rel="stylesheet" href="../../css/style.css">
</head>

<body>

    <div class="navbar">

        <a href="dashboard.html">Dashboard</a>
        <a href="customers.html">Customers</a>
        <a href="venues.html">Venues</a>
        <a href="events.html">Events</a>
        <a href="seats.html">Seats</a>

    </div>


    <div class="box">

        <h1>Venue Management</h1>


        <input type="hidden"
               id="venueId">


        <input type="text"
               id="venueName"
               placeholder="Venue Name">


        <input type="text"
               id="location"
               placeholder="Location">


        <input type="number"
               id="capacity"
               placeholder="Capacity">


        <button class="btn green"
                onclick="saveVenue()">
            Save Venue
        </button>


        <button class="btn"
                onclick="clearForm()">
            Clear
        </button>


        <hr>


        <h2>Venue List</h2>


        <div id="venueList"></div>


    </div>


    <script src="../../js/config.js"></script>
    <script src="../../js/api.js"></script>


    <script>

async function loadVenues()
{
    try
    {
        const venues =
            await apiCall(
                "/venues",
                "GET"
            );

        let html = "";

        venues.forEach(v =>
        {
            html += `

                <div class="card">

                    <h3>
                        ${v.venueName || ""}
                    </h3>

                    <p>
                        Location:
                        ${v.location || ""}
                    </p>

                    <p>
                        Capacity:
                        ${v.capacity || 0}
                    </p>

                    <button
                        class="btn"
                        onclick='editVenue(${JSON.stringify(v)})'
                    >
                        Edit
                    </button>

                    <button
                        class="btn red"
                        onclick="deleteVenue(${v.venueId})"
                    >
                        Delete
                    </button>

                </div>

            `;
        });


        document.getElementById("venueList")
            .innerHTML = html;
    }
    catch(error)
    {
        document.getElementById("venueList")
            .innerHTML =
            "<p>Unable to load venues.</p>";
    }
}



async function saveVenue()
{
    const id =
        document.getElementById("venueId").value;


    const data =
    {
        venueName:
            document.getElementById("venueName").value,

        location:
            document.getElementById("location").value,

        capacity:
            Number(
                document.getElementById("capacity").value
            )
    };


    try
    {
        if(id)
        {
            await apiCall(
                "/venues/" + id,
                "PUT",
                data
            );

            alert("Venue updated successfully.");
        }
        else
        {
            await apiCall(
                "/venues",
                "POST",
                data
            );

            alert("Venue created successfully.");
        }


        clearForm();

        loadVenues();
    }
    catch(error)
    {
        alert(
            error.message ||
            "Unable to save venue."
        );
    }
}



function editVenue(venue)
{
    document.getElementById("venueId").value =
        venue.venueId || "";


    document.getElementById("venueName").value =
        venue.venueName || "";


    document.getElementById("location").value =
        venue.location || "";


    document.getElementById("capacity").value =
        venue.capacity || "";
}



async function deleteVenue(id)
{
    if(
        !confirm(
            "Are you sure you want to delete this venue?"
        )
    )
    {
        return;
    }


    try
    {
        await apiCall(
            "/venues/" + id,
            "DELETE"
        );


        alert("Venue deleted successfully.");

        loadVenues();
    }
    catch(error)
    {
        alert(
            error.message ||
            "Unable to delete venue."
        );
    }
}



function clearForm()
{
    document.getElementById("venueId").value = "";

    document.getElementById("venueName").value = "";

    document.getElementById("location").value = "";

    document.getElementById("capacity").value = "";
}


loadVenues();

    </script>

</body>

</html>
