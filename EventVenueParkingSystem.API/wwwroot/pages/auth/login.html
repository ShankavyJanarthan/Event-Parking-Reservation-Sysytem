<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login</title>

    <link rel="stylesheet" href="../../css/style.css">

</head>


<body>


    <div class="container">

        <div class="box">


            <h1>
                Customer Login
            </h1>


            <form id="loginForm">


                <input type="email"
                       id="loginEmail"
                       placeholder="Email"
                       required>


                <br><br>


                <input type="password"
                       id="loginPassword"
                       placeholder="Password"
                       required>


                <br><br>


                <button class="btn">
                    Login
                </button>


            </form>


            <p id="loginMessage"></p>


            <a href="register.html">
                Create new account
            </a>


        </div>

    </div>



    <script src="../../js/config.js"></script>

    <script src="../../js/api.js"></script>

    <script src="../../js/auth.js"></script>


</body>

</html>
