<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register</title>

    <link rel="stylesheet" href="../../css/style.css">

</head>


<body>


    <div class="container">

        <div class="box">


            <h1>
                Customer Register
            </h1>


            <form id="registerForm">


                <input id="fullName"
                       type="text"
                       placeholder="Full Name"
                       required>


                <br><br>


                <input id="email"
                       type="email"
                       placeholder="Email"
                       required>


                <br><br>


                <input id="phoneNumber"
                       type="text"
                       placeholder="Phone Number"
                       required>


                <br><br>


                <input id="password"
                       type="password"
                       placeholder="Password"
                       required>


                <br><br>


                <button class="btn">
                    Register
                </button>


            </form>


            <p id="message"></p>


            <a href="login.html">
                Already have account? Login
            </a>


        </div>

    </div>



    <script src="../../js/config.js"></script>

    <script src="../../js/api.js"></script>

    <script src="../../js/auth.js"></script>


</body>

</html>
