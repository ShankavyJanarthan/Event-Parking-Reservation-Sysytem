<!DOCTYPE html>
<html>

<head>

    <title>
        Booking Summary
    </title>

    <link rel="stylesheet" href="../../css/style.css">

</head>


<body>


    <div class="box">


        <h1>
            Booking Summary
        </h1>


        <div class="card">

            <h3>
                Event Booking
            </h3>


            <p>
                Seat:
                <span id="seat">
                </span>
            </p>


            <p>
                Parking:
                <span id="parking">
                    Not Selected
                </span>
            </p>


        </div>



        <h2>
            Complete Payment Within
        </h2>


        <h1 id="timer">

            15:00

        </h1>



        <button class="btn green"
                onclick="goPayment()">

            Proceed Payment

        </button>



        <p id="message"></p>


    </div>



    <script src="../../js/customer/timer.js"></script>


</body>

</html>
