<!DOCTYPE html>
<html>

<head>

    <title>Customer Dashboard</title>

    <link rel="stylesheet" href="../../css/style.css">

</head>


<body>


    <!-- Navigation -->

    <div class="navbar">

        <a href="dashboard.html">
            Dashboard
        </a>

        <a href="events.html">
            Events
        </a>

        <a href="bookings.html">
            My Bookings
        </a>

        <a href="profile.html">
            Profile
        </a>

        <a href="notifications.html">
            Notifications
        </a>

    </div>



    <div class="box">


        <h1>
            Welcome Customer
        </h1>


        <p>
            Event & Parking Reservation System
        </p>



        <div class="dashboard-grid">


            <div class="dashboard-card">

                <h3>
                    Browse Events
                </h3>

                <p>
                    Find and reserve events
                </p>


                <a class="btn"
                   href="events.html">

                    View Events

                </a>


            </div>




            <div class="dashboard-card">

                <h3>
                    My Bookings
                </h3>

                <p>
                    View booking history
                </p>


                <a class="btn green"
                   href="bookings.html">

                    Bookings

                </a>


            </div>





            <div class="dashboard-card">

                <h3>
                    Profile
                </h3>

                <p>
                    Update your details
                </p>


                <a class="btn"
                   href="profile.html">

                    Profile

                </a>


            </div>





            <div class="dashboard-card">

                <h3>
                    Notifications
                </h3>

                <p>
                    Check updates
                </p>


                <a class="btn green"
                   href="notifications.html">

                    View

                </a>


            </div>



        </div>




        <br>


        <button class="btn red"
                onclick="logout()">

            Logout

        </button>



    </div>




    <script>


        function logout() {


            localStorage.clear();


            window.location.href = "../../index.html";


        }


    </script>



</body>

</html>
