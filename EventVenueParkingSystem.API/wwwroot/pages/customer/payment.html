<!DOCTYPE html>
<html>

<head>

    <title>Secure Payment</title>

    <link rel="stylesheet" href="../../css/style.css">

</head>


<body>


    <div class="box payment-box">


        <h1>
            💳 Secure Payment
        </h1>


        <div class="card">

            <h3>
                Booking Summary
            </h3>

            <p>
                Event Ticket
            </p>

            <p>
                Parking Included
            </p>

            <h2>
                Total: Rs. 2500
            </h2>

        </div>



        <select id="method">

            <option>
                Credit Card
            </option>

            <option>
                Debit Card
            </option>

            <option>
                Online Banking
            </option>

        </select>



        <input id="card"
               placeholder="Card Number">


        <input id="cvv"
               placeholder="CVV">


        <button class="btn green"
                onclick="pay()">

            Pay Now

        </button>


        <div id="loader">

        </div>


        <p id="msg"></p>


    </div>


    <script src="../../js/config.js"></script>
    <script src="../../js/api.js"></script>
    <script src="../../js/customer/payment.js"></script>


</body>

</html>
